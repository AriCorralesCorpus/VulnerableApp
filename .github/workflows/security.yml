name: Security Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:

  sonarqube:
    name: SonarQube - Análisis estático
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VulnerableApp.csproj

      - name: Build application
        run: dotnet build VulnerableApp.csproj --no-restore


  dast-zap:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VulnerableApp.csproj

      - name: Build application
        run: dotnet build VulnerableApp.csproj --configuration Release --no-restore

      - name: Start VulnerableApp
        run: |
          nohup dotnet run --project VulnerableApp.csproj \
            --configuration Release \
            --no-build \
            --urls http://localhost:8080 > app.log 2>&1 &

          echo "Esperando a que la aplicación inicie..."

          for i in {1..30}; do
            if curl -f http://localhost:8080/ > /dev/null 2>&1; then
              echo "Aplicación iniciada correctamente."
              break
            fi

            echo "Esperando... intento $i"
            sleep 2
          done

          curl -f http://localhost:8080/

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
            report_xml.xml